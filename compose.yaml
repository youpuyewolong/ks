services:
  stories:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "${PORT:-5173}:5173"
    environment:
      HOST: 0.0.0.0
      PORT: 5173
      DATA_DIR: /app/data
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Please set ADMIN_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    volumes:
      - story-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  story-data:
